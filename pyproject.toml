[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelvision"
version = "0.1.0"
description = "An end-to-end GPU optimization study of object-detection inference."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
inference = ["ultralytics>=8.3,<9"]
remote = ["modal==1.2.6"]

[project.scripts]
kernelvision = "kernelvision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
